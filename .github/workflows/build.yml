name: Build e release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências de teste
        run: python -m pip install "websockets>=14"
      - name: Testes de rede
        run: python tests/test_flow.py
      - name: Testes do túnel
        run: python tests/test_tunnel.py

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --windowed --name KioBotEX --icon assets/icon.ico
          --add-data "assets;assets" --hidden-import relay --hidden-import protocol
          --hidden-import tunnel main.py
      - name: Compactar
        run: Compress-Archive -Path dist/KioBotEX -DestinationPath KioBotEX-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KioBotEX-windows
          path: KioBotEX-windows.zip
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" KioBotEX-windows.zip
          --title "KioBot EX ${{ github.ref_name }}" --generate-notes
